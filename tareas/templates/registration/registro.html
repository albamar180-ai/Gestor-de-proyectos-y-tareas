{% extends 'tareas/base.html' %}

{% block title %}Crear cuenta{% endblock %}

{% block content %}

<div style="max-width: 550px; margin: 30px auto;">

    <div style="text-align: center; margin-bottom: 25px;">
        <div style="font-size: 55px;">🌟</div>

        <h2 style="margin-bottom: 5px; color: #d97706;">
            ¡Crea tu cuenta!
        </h2>

        <p style="color: #7c5a35;">
            Regístrate para comenzar a organizar tus proyectos y tareas.
        </p>
    </div>

    <div style="
        background-color: #fff8ed;
        padding: 30px;
        border-radius: 15px;
        border: 2px solid #fcd38d;
    ">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="boton"
                style="width: 100%; margin-top: 15px;"
            >
                ✨ Crear mi cuenta
            </button>

        </form>

    </div>

    <p style="
        text-align: center;
        margin-top: 20px;
        color: #7c5a35;
    ">
        ¿Ya tienes una cuenta?
        <a href="{% url 'login' %}"
           style="color: #f97316; font-weight: bold;">
            Iniciar sesión
        </a>
    </p>

</div>

{% endblock %}
